# Conda environment for the Windows release builds (#681). Every package is
# pinned to an exact version, build and md5, and
# .github/actions/windows-build/action.yml creates the "omotion" env from this
# file with no solve, so two builds of the same commit get the same Python and
# the same C libraries. The pins that matter are python 3.12.14, openssl 3.5.9,
# libexpat 2.8.5 and sqlite 3.53.4; the rest is what conda resolved with them
# on the defaults channel.
#
# To move a pin, re-resolve on win-64 and replace everything below @EXPLICIT:
#   conda create -p <tmp> --override-channels -c defaults python=3.12.14 openssl=3.5.9 libexpat=2.8.5 sqlite=3.53.4 pip
#   conda list -p <tmp> --explicit --md5
# Same environment for a local build: conda create -n omotion --file conda-win-64.lock
#
# platform: win-64
