[pytest]
# Run tests in definition order (critical for sequential UI tests)
addopts = -v --tb=short --junitxml=test_logs/results.xml
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_file = test_logs/pytest.log
log_file_level = INFO
markers =
    dev: short HIL tests (~1-3 min each); run on every push to next via the chained HIL workflow
    release: long HIL tests (full scans, multi-iteration repros); run only when a release-pattern tag lands
    unit: pure-Python unit tests; the conftest autouse fixtures short-circuit on this marker so no app launch / UI machinery fires
