name: Build & Release

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Code-sign artifacts (requires the eSigner secrets; 6 metered signings)"
        type: boolean
        default: false
      compiler:
        description: "Windows build: nuitka (default, native compile) or pyinstaller (fallback)"
        type: choice
        options: [nuitka, pyinstaller]
        default: nuitka
  push:
    branches: [main, next]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"             # production release (cut from main)       — SDK pinned by sdk-version.txt
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"   # release candidate (cut from next)        — SDK pinned by sdk-version.txt
      - "[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"  # dev pre-release   (cut from next)        — SDK from @next source
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── conda environment "omotion" ──────────────────────────────
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          activate-environment: omotion

      - name: Install dependencies into omotion
        shell: bash -el {0}
        run: |
          conda activate omotion
          python -m pip install --upgrade pip

          # SDK selection (#545):
          #   * X.Y.Z-dev.N tag / refs/heads/next push → source-install from
          #     openmotion-sdk@next. The bloodflow next branch tracks SDK API
          #     drift before any release, so it must always pair with SDK
          #     next; PyPI's latest stable can be API-behind.
          #   * Everything else (X.Y.Z production tag, X.Y.Z-rc.N tag,
          #     refs/heads/main push, manual dispatch) → the exact release
          #     pinned in sdk-version.txt, so the binary, the SBOM and the
          #     verification evidence all describe the same SDK. Bump the
          #     pin before tagging an rc/production release; the check step
          #     below fails the build if the installed SDK does not match.
          SDK_PIN=$(tr -d '[:space:]' < sdk-version.txt)
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            echo "Dev/next-branch ($GITHUB_REF) — installing SDK from openmotion-sdk@next"
            pip install "git+https://github.com/OpenwaterHealth/openmotion-sdk.git@next"
          else
            echo "Release/rc/main/dispatch ($GITHUB_REF) — installing openmotion-sdk==${SDK_PIN} (sdk-version.txt)"
            pip install "openmotion-sdk==${SDK_PIN}"
          fi

          pip install -r requirements.txt

      - name: Check the bundled SDK against sdk-version.txt
        shell: bash -el {0}
        run: |
          conda activate omotion
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            python scripts/check_sdk_pin.py            # dev: report only
          else
            python scripts/check_sdk_pin.py --enforce
          fi

      # ── build ────────────────────────────────────────────────────
      - name: Stamp version from git tag
        shell: bash -el {0}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Strip leading 'v' only; '-dev.N' suffixes stay (semver pre-release).
            VER="${TAG#v}"
          else
            VER=$(git describe --tags --dirty --always --long 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "Stamping version: $VER"
          # Update _FALLBACK_VERSION in version.py so the frozen exe uses it
          sed -i "s/^_FALLBACK_VERSION = .*/_FALLBACK_VERSION = \"${VER}\"/" version.py

      # PyInstaller is the fallback only (workflow_dispatch compiler=pyinstaller)
      # since Nuitka became the default on 2026-09-17 (#548).
      - name: Build with PyInstaller (one build per variant)
        if: github.event_name == 'workflow_dispatch' && inputs.compiler == 'pyinstaller'
        shell: bash -el {0}
        run: |
          conda activate omotion
          # #546: the Clinical/Research split is compiled in. Stamp
          # CLINICAL_MODE into config/app_config.py, build, repeat; the
          # repo value (Research) is restored afterwards. portableMode is
          # derived at launch (HKLM InstallDir marker), so the portable zip
          # and the installer share each variant's exe byte-for-byte.
          for variant in clinical research; do
            if [ "$variant" = "clinical" ]; then flag=True; else flag=False; fi
            sed -i "s/^CLINICAL_MODE = .*/CLINICAL_MODE = ${flag}/" config/app_config.py
            grep -n "^CLINICAL_MODE = " config/app_config.py
            # onefile (#547): the output is dist/<variant>/Open-Motion/Open-Motion.exe
            # and nothing else; the folder keeps the zip / MSI shape unchanged.
            python -m PyInstaller -y openwater.spec --distpath "dist/${variant}/Open-Motion" --workpath "build/${variant}"
          done
          sed -i "s/^CLINICAL_MODE = .*/CLINICAL_MODE = False/" config/app_config.py
          git diff --exit-code -- config/app_config.py

      # ── Nuitka native compile (#548): the default since 2026-09-17 ─────
      # Every module compiled to C with MSVC (present on windows-latest); same
      # onefile output contract as the PyInstaller fallback, so packaging
      # below is unchanged. nuitka / ordered-set / zstandard come from
      # requirements.txt so the SBOM records the compiler. The C-compile
      # cache is restored between runs: a cold build is tens of minutes per
      # variant on the 2-core runner, a warm one a fraction of that.
      - name: Cache Nuitka's C-compile cache
        if: github.event_name != 'workflow_dispatch' || inputs.compiler != 'pyinstaller'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'sdk-version.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'sdk-version.txt') }}-
            nuitka-${{ runner.os }}-

      - name: Build with Nuitka (one build per variant)
        if: github.event_name != 'workflow_dispatch' || inputs.compiler != 'pyinstaller'
        shell: bash -el {0}
        run: |
          conda activate omotion
          python -m nuitka --version
          for variant in clinical research; do
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_nuitka.ps1 -Variant "$variant"
          done
          git diff --exit-code -- config/app_config.py

      - name: Install WiX v5
        shell: pwsh
        run: |
          # Pin to 5.0.2 — the last MIT-licensed WiX. v6/v7 require accepting the
          # paid Open Source Maintenance Fee EULA (WIX7015) and would fail CI.
          dotnet tool install --global wix --version 5.0.2
          # In WiX v5 the standard bootstrapper application ships in this package
          # (not WixToolset.Bal.wixext); the bal: namespace in bundle.wxs is unchanged.
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ── eSigner CKA: load the EV code-signing cert (#358 / #443) ─────
      # PRODUCTION tag builds only (X.Y.Z with no pre-release suffix), plus
      # manual runs with sign=true, Authenticode-sign the shipped Windows
      # artifacts with the org's SSL.com EV cert: 6 metered eSigner signings
      # per build (the exe, the Burn engine and the Setup bundle, per
      # variant; the app MSI inside the bundle is deliberately unsigned,
      # #569). dev/rc pre-release tags and branch pushes build UNSIGNED to
      # conserve the signing quota. The private key never leaves SSL.com's
      # cloud HSM; eSigner CKA exposes it through Windows CNG so native
      # signtool works against a store thumbprint. When the ES_* secrets are
      # absent this warns and the build ships unsigned. See docs/SIGNING.md.
      - name: Set up eSigner CKA (EV code signing)
        if: (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')) || (github.event_name == 'workflow_dispatch' && inputs.sign)
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          # repo variable ES_MODE=sandbox targets SSL.com's sandbox
          # environment for pipeline testing (needs sandbox credentials)
          ES_MODE: ${{ vars.ES_MODE || 'product' }}
        run: |
          if (-not $env:ES_USERNAME -or -not $env:ES_PASSWORD -or -not $env:ES_TOTP_SECRET) {
            Write-Host "::warning::eSigner secrets (ES_USERNAME / ES_PASSWORD / ES_TOTP_SECRET) not set — artifacts will be UNSIGNED"
            exit 0
          }
          $work = Join-Path $env:RUNNER_TEMP "esigner-cka"
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          Invoke-WebRequest -OutFile eSigner_CKA_Setup.zip "https://github.com/SSLcom/eSignerCKA/releases/download/v1.0.8/SSL.COM-eSigner-CKA_1.0.8.zip"
          Expand-Archive -Force eSigner_CKA_Setup.zip
          Move-Item -Destination "eSigner_CKA_Installer.exe" -Path "eSigner_CKA_Setup\*.exe"
          $dir = Join-Path $env:USERPROFILE "eSignerCKA"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Start-Process ".\eSigner_CKA_Installer.exe" -ArgumentList "/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR=`"$dir`"" -Wait
          # Post-install helpers from SSL.com's reference workflow; guarded
          # because not every CKA build ships them (VC++ redists are already
          # on the hosted runners).
          foreach ($aux in @("$work\setup\vc_redist.x86.exe", "$work\setup\vc_redist.x64.exe")) {
            if (Test-Path $aux) { Start-Process $aux -ArgumentList "/install /q" -Wait }
          }
          foreach ($aux in @("$dir\RegisterKSP.exe", "$dir\eSignerCSP.Config.exe")) {
            if (Test-Path $aux) { & $aux | Out-Null }
          }
          & "$dir\eSignerCKATool.exe" config -mode $env:ES_MODE -user $env:ES_USERNAME -pass $env:ES_PASSWORD -totp $env:ES_TOTP_SECRET -key "$dir\master.key" -r
          & "$dir\eSignerCKATool.exe" unload
          & "$dir\eSignerCKATool.exe" load
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          if (-not $cert) { throw "eSigner CKA loaded no code-signing certificate" }
          Write-Host "Signing as: $($cert.Subject)  [$($cert.Thumbprint)]"
          "CODESIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # ── package ──────────────────────────────────────────────────
      - name: Determine version tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --dirty --always 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=Open-Motion-${TAG}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_ZIP=Open-Motion-${TAG}.zip" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME_RESEARCH=Open-Motion-Research-${TAG}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_ZIP_RESEARCH=Open-Motion-Research-${TAG}.zip" >> "$GITHUB_OUTPUT"

          # pre-release flag — X.Y.Z-dev.N (dev) and X.Y.Z-rc.N (release
          # candidate) tags both mark prerelease in the GitHub release UI.
          if [[ "$TAG" == *-dev.* ]] || [[ "$TAG" == *-rc.* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

          echo "::notice ::Version tag resolved to: ${TAG}"

      # ── SBOM (#545) ─────────────────────────────────────────────
      - name: Generate SBOM (CycloneDX) of the build environment
        id: sbom
        shell: bash -el {0}
        run: |
          conda activate omotion
          BUILD_PY=$(python -c "import sys; print(sys.executable)")
          SBOM="Open-Motion-${{ steps.meta.outputs.TAG }}-sbom.cdx.json"
          # pipx runs the generator from its own venv, so the tool does not
          # show up in the SBOM of the environment it inspects. One SBOM
          # covers both Windows variants: they are frozen from this same env.
          pipx run --spec cyclonedx-bom cyclonedx-py environment "$BUILD_PY" \
            --of JSON --mc-type application -o "$SBOM"
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            python scripts/stamp_sbom.py "$SBOM" --name Open-Motion --version "${{ steps.meta.outputs.TAG }}"
          else
            python scripts/stamp_sbom.py "$SBOM" --name Open-Motion --version "${{ steps.meta.outputs.TAG }}" \
              --expect-sdk "$(tr -d '[:space:]' < sdk-version.txt)"
          fi
          echo "SBOM_PATH=${SBOM}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Motion-${{ steps.meta.outputs.TAG }}-sbom
          path: ${{ steps.sbom.outputs.SBOM_PATH }}

      - name: Package all artifacts (zips + installers, clinical + Research)
        shell: pwsh
        env:
          # env.CODESIGN_THUMBPRINT is exported by the eSigner CKA step above;
          # the secret is a manual fallback for a runner with a local cert.
          CODESIGN_THUMBPRINT: ${{ env.CODESIGN_THUMBPRINT || secrets.CODESIGN_THUMBPRINT }}
        run: |
          powershell -NoProfile -File scripts\package_artifacts.ps1 -SkipBuild -Version "${{ steps.meta.outputs.TAG }}"

      # ── always upload workflow artifact ──────────────────────────
      # upload-artifact wraps whatever it is given in its own zip, so
      # handing it the portable zip made every run download a zip inside
      # a zip (#567). Upload the packaged dist tree instead: it is the
      # exact tree New-PortableZip compresses (signed exe included), so the
      # download is Open-Motion-<tag>.zip holding Open-Motion\ directly -
      # the same layout as the release asset.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ARTIFACT_NAME }}
          path: dist/clinical

      - name: Upload Research workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ARTIFACT_NAME_RESEARCH }}
          path: dist/research

      # ── build release notes ───────────────────────────────────────
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        run: |
          : > notes.md

          if [[ "${{ steps.meta.outputs.PRERELEASE }}" == "true" ]]; then
            echo "⚠️ **PRE-RELEASE – NOT FOR PRODUCTION**" >> notes.md
            echo "" >> notes.md
          fi

          # Commits since previous tag (bullet list)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since ${PREV_TAG}" >> notes.md
            echo "" >> notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" >> notes.md
            echo "" >> notes.md
            echo "" >> notes.md
            echo "**Full diff:** [\`${PREV_TAG}...${{ steps.meta.outputs.TAG }}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.meta.outputs.TAG }})" >> notes.md
          else
            echo "### Commits" >> notes.md
            echo "" >> notes.md
            git log --pretty=format:"- %s (%h)" -20 >> notes.md
          fi

      # ── create release on tag push ──────────────────────────────
      # softprops creates (or updates) the release with the notes only. The
      # assets go up in the next step, one at a time with retries: the
      # action's parallel upload died mid-way with "Error saving asset" on
      # both attempts of 1.5.3-dev.0 (#555), and with overwrite_files it had
      # already deleted the previous assets, so every retry left the release
      # with a different partial set.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: ${{ steps.meta.outputs.TAG }}
          body_path: notes.md
          prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (sequential, with retries)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.TAG }}
        run: |
          set -euo pipefail
          assets=(
            "${{ steps.meta.outputs.ARTIFACT_ZIP }}"
            "${{ steps.meta.outputs.ARTIFACT_ZIP_RESEARCH }}"
            "${{ steps.sbom.outputs.SBOM_PATH }}"
            build/installer/Open-Motion-Setup-*.exe
            build/installer/Open-Motion-Research-Setup-*.exe
            resources/OpenMotionDriver-x64.zip
          )
          for f in "${assets[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::release asset missing on disk: $f"
              exit 1
            fi
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber -R "$GITHUB_REPOSITORY"; then
                echo "uploaded $f"
                break
              fi
              echo "upload of $f failed (attempt $attempt/3)"
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 20
            done
          done
          # Every asset must be on the release when this job reports success,
          # so a silent partial upload fails the job.
          present=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "release assets:"; echo "$present" | sed 's/^/  /'
          for f in "${assets[@]}"; do
            if ! echo "$present" | grep -qx "$(basename "$f")"; then
              echo "::error::asset not on release after upload: $(basename "$f")"
              exit 1
            fi
          done

  build-macos:
    runs-on: macos-15   # Apple Silicon runner
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libusb
        run: brew install libusb

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          # SDK selection — mirrors the Windows job above (see the comment
          # there for the full rationale, #545).
          SDK_PIN=$(tr -d '[:space:]' < sdk-version.txt)
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            echo "Dev/next-branch ($GITHUB_REF) — installing SDK from openmotion-sdk@next"
            pip install "git+https://github.com/OpenwaterHealth/openmotion-sdk.git@next"
          else
            echo "Release/rc/main/dispatch ($GITHUB_REF) — installing openmotion-sdk==${SDK_PIN} (sdk-version.txt)"
            pip install "openmotion-sdk==${SDK_PIN}"
          fi

          pip install -r requirements.txt

          # requirements.txt pins PyInstaller 6.11.1 for the Windows build.
          # 6.11 has a macOS bug that creates Qt framework symlinks twice
          # (FileExistsError on Versions/Current/* during assemble); fixed
          # in later 6.x. Override the pin for this job only.
          pip install --upgrade "pyinstaller>=6.13"

      - name: Check the bundled SDK against sdk-version.txt
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            python scripts/check_sdk_pin.py            # dev: report only
          else
            python scripts/check_sdk_pin.py --enforce
          fi

      - name: Stamp version from git tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER=$(git describe --tags --dirty --always --long 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "Stamping version: $VER"
          # BSD sed needs an explicit (empty) backup suffix with -i
          sed -i '' "s/^_FALLBACK_VERSION = .*/_FALLBACK_VERSION = \"${VER}\"/" version.py

      - name: Determine version tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --dirty --always 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-dev.* ]] || [[ "$TAG" == *-rc.* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice ::Version tag resolved to: ${TAG}"

      - name: Generate SBOM (CycloneDX) of the build environment
        id: sbom
        shell: bash
        run: |
          BUILD_PY=$(python -c "import sys; print(sys.executable)")
          SBOM="Open-Motion-${{ steps.meta.outputs.TAG }}-macOS-sbom.cdx.json"
          pipx run --spec cyclonedx-bom cyclonedx-py environment "$BUILD_PY" \
            --of JSON --mc-type application -o "$SBOM"
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            python scripts/stamp_sbom.py "$SBOM" --name Open-Motion-macOS --version "${{ steps.meta.outputs.TAG }}"
          else
            python scripts/stamp_sbom.py "$SBOM" --name Open-Motion-macOS --version "${{ steps.meta.outputs.TAG }}" \
              --expect-sdk "$(tr -d '[:space:]' < sdk-version.txt)"
          fi
          echo "SBOM_PATH=${SBOM}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Motion-${{ steps.meta.outputs.TAG }}-macOS-sbom
          path: ${{ steps.sbom.outputs.SBOM_PATH }}

      - name: Build .app + DMG
        shell: bash
        env:
          # The version-stamp sed above dirties the checkout, so letting
          # build_macos.sh derive the version from `git describe --dirty`
          # would name the DMG "<tag>+dirty". Pass the clean tag instead.
          OPENMOTION_VERSION: ${{ steps.meta.outputs.TAG }}
        run: ./build_macos.sh   # CI env var is set by Actions → Finder styling and `open` are skipped

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          DMG_PATH=$(ls dist/Open-Motion-*-macOS.dmg | head -1)
          echo "DMG_PATH=${DMG_PATH}" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$(basename "$DMG_PATH" .dmg)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.DMG_NAME }}
          path: ${{ steps.dmg.outputs.DMG_PATH }}

      # Attach the DMG to the same release the Windows job creates. Both
      # jobs target the same tag; action-gh-release appends assets to an
      # existing release rather than clobbering it, so ordering is safe.
      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
          files: |
            ${{ steps.dmg.outputs.DMG_PATH }}
            ${{ steps.sbom.outputs.SBOM_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
