name: Build & Release

# What ships where (#573). This repository is PUBLIC: a release asset, an
# upload-artifact upload and this log are all world-readable, so this workflow
# builds the RESEARCH variant only.
#
#   tag            Research (GitHub Release, here)       Clinical (Google Drive, private repo)
#   X.Y.Z-dev.N    portable zip + installer, unsigned    portable zip + installer, unsigned
#   X.Y.Z-rc.N     portable zip + installer, SIGNED      portable zip + installer, SIGNED
#   X.Y.Z          installer only, SIGNED                nothing automatic; the signed installer
#                                                        is a manual run in the private repo
#
# Clinical builds live in the private OpenwaterHealth/openmotion-desktop-app-clinical
# repository, which checks this repo out at the tag and runs the same
# .github/actions/windows-build. The notify-clinical job below only pokes it
# on dev/rc tags; it never waits for it, so the two are not in lockstep.
# NEVER build, upload or attach a Clinical binary from this workflow.

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Code-sign artifacts (requires the eSigner secrets; 3 metered signings)"
        type: boolean
        default: false
      compiler:
        description: "Windows build: nuitka (default, native compile) or pyinstaller (fallback)"
        type: choice
        options: [nuitka, pyinstaller]
        default: nuitka
  push:
    branches: [main, next]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"             # production release (cut from main)       — SDK pinned by sdk-version.txt
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"   # release candidate (cut from next)        — SDK pinned by sdk-version.txt
      - "[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"  # dev pre-release   (cut from next)        — SDK from @next source
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── build + sign + package (Research only) ───────────────────
      # Signing policy (#443, #573): rc and production tags sign, plus a
      # manual run with sign=true; dev tags and branch pushes build UNSIGNED.
      # Every signing is metered (3 per signed build here: exe, Burn engine,
      # Setup bundle). rc signing is deliberate for the first releases under
      # #573 and is expected to be dropped later to conserve quota: remove
      # the `-rc.` half of the expression, nothing else. See docs/SIGNING.md.
      - name: Build Research (Windows)
        id: win
        uses: ./.github/actions/windows-build
        with:
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          sdk-next: ${{ github.ref == 'refs/heads/next' }}
          variants: research
          sign: ${{ (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev.')) || (github.event_name == 'workflow_dispatch' && inputs.sign) }}
          compiler: ${{ github.event_name == 'workflow_dispatch' && inputs.compiler || 'nuitka' }}
          es-username: ${{ secrets.ES_USERNAME }}
          es-password: ${{ secrets.ES_PASSWORD }}
          es-totp-secret: ${{ secrets.ES_TOTP_SECRET }}
          # repo variable ES_MODE=sandbox targets SSL.com's sandbox
          # environment for pipeline testing (needs sandbox credentials)
          es-mode: ${{ vars.ES_MODE || 'product' }}
          codesign-thumbprint: ${{ secrets.CODESIGN_THUMBPRINT }}

      - name: Upload SBOM workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Motion-${{ steps.win.outputs.tag }}-sbom
          path: ${{ steps.win.outputs.sbom-path }}

      # ── always upload workflow artifact ──────────────────────────
      # upload-artifact wraps whatever it is given in its own zip, so
      # handing it the portable zip made every run download a zip inside
      # a zip (#567). Upload the packaged dist tree instead: it is the
      # exact tree New-PortableZip compresses (signed exe included), so the
      # download is Open-Motion-Research-<tag>.zip holding Open-Motion\
      # directly - the same layout as the release asset.
      - name: Upload Research workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Motion-Research-${{ steps.win.outputs.tag }}
          path: dist/research

      # ── build release notes ───────────────────────────────────────
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        run: |
          : > notes.md

          if [[ "${{ steps.win.outputs.prerelease }}" == "true" ]]; then
            echo "⚠️ **PRE-RELEASE – NOT FOR PRODUCTION**" >> notes.md
            echo "" >> notes.md
          fi

          # Commits since previous tag (bullet list)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since ${PREV_TAG}" >> notes.md
            echo "" >> notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" >> notes.md
            echo "" >> notes.md
            echo "" >> notes.md
            echo "**Full diff:** [\`${PREV_TAG}...${{ steps.win.outputs.tag }}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.win.outputs.tag }})" >> notes.md
          else
            echo "### Commits" >> notes.md
            echo "" >> notes.md
            git log --pretty=format:"- %s (%h)" -20 >> notes.md
          fi

      # ── create release on tag push ──────────────────────────────
      # softprops creates (or updates) the release with the notes only. The
      # assets go up in the next step, one at a time with retries: the
      # action's parallel upload died mid-way with "Error saving asset" on
      # both attempts of 1.5.3-dev.0 (#555), and with overwrite_files it had
      # already deleted the previous assets, so every retry left the release
      # with a different partial set.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.win.outputs.tag }}
          name: ${{ steps.win.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ steps.win.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (sequential, with retries)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.win.outputs.tag }}
          CHANNEL: ${{ steps.win.outputs.channel }}
        run: |
          set -euo pipefail
          # Research only (#573). A production release carries the installer
          # and no portable zip; dev and rc carry both.
          assets=(
            "${{ steps.win.outputs.sbom-path }}"
            build/installer/Open-Motion-Research-Setup-*.exe
            resources/OpenMotionDriver-x64.zip
          )
          if [ "$CHANNEL" != "prod" ]; then
            assets+=("Open-Motion-Research-${TAG}.zip")
          fi
          for f in "${assets[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::release asset missing on disk: $f"
              exit 1
            fi
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber -R "$GITHUB_REPOSITORY"; then
                echo "uploaded $f"
                break
              fi
              echo "upload of $f failed (attempt $attempt/3)"
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 20
            done
          done
          # Every asset must be on the release when this job reports success,
          # so a silent partial upload fails the job.
          present=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "release assets:"; echo "$present" | sed 's/^/  /'
          for f in "${assets[@]}"; do
            if ! echo "$present" | grep -qx "$(basename "$f")"; then
              echo "::error::asset not on release after upload: $(basename "$f")"
              exit 1
            fi
          done

  # ── Clinical: poke the private repo, never wait for it (#573) ─────
  # dev and rc tags only; a production tag does nothing here (the signed
  # Clinical installer is a manual run in the private repo). No `needs:`, so
  # the Clinical build neither waits on nor blocks the Research release, and
  # a failed poke is a warning, not a failed release. The token is a
  # fine-grained PAT limited to that one repository (Actions: read/write).
  notify-clinical:
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch the Clinical pre-release build
        env:
          GH_TOKEN: ${{ secrets.CLINICAL_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CLINICAL_DISPATCH_TOKEN not set — Clinical build for ${TAG} was NOT started; run clinical-prerelease.yml by hand"
            exit 0
          fi
          # The REST endpoint with an explicit ref, not the gh "workflow run"
          # command: that one first resolves the repo's default branch over
          # GraphQL, which a token holding only Actions: write cannot read
          # (1.5.3-dev.3: "Resource not accessible by personal access token").
          DISPATCH=repos/OpenwaterHealth/openmotion-desktop-app-clinical/actions/workflows/clinical-prerelease.yml/dispatches
          if ! gh api -X POST "$DISPATCH" -f ref=main -f "inputs[tag]=$TAG"; then
            echo "::warning::could not start the Clinical build for ${TAG}; run clinical-prerelease.yml by hand"
          fi

  build-macos:
    runs-on: macos-15   # Apple Silicon runner
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libusb
        run: brew install libusb

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          # SDK selection — mirrors the Windows job above (see the comment
          # there for the full rationale, #545).
          SDK_PIN=$(tr -d '[:space:]' < sdk-version.txt)
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            echo "Dev/next-branch ($GITHUB_REF) — installing SDK from openmotion-sdk@next"
            pip install "git+https://github.com/OpenwaterHealth/openmotion-sdk.git@next"
          else
            echo "Release/rc/main/dispatch ($GITHUB_REF) — installing openmotion-sdk==${SDK_PIN} (sdk-version.txt)"
            pip install "openmotion-sdk==${SDK_PIN}"
          fi

          pip install -r requirements.txt

          # requirements.txt pins PyInstaller 6.11.1 for the Windows build.
          # 6.11 has a macOS bug that creates Qt framework symlinks twice
          # (FileExistsError on Versions/Current/* during assemble); fixed
          # in later 6.x. Override the pin for this job only.
          pip install --upgrade "pyinstaller>=6.13"

      - name: Check the bundled SDK against sdk-version.txt
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            python scripts/check_sdk_pin.py            # dev: report only
          else
            python scripts/check_sdk_pin.py --enforce
          fi

      - name: Stamp version from git tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER=$(git describe --tags --dirty --always --long 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "Stamping version: $VER"
          # BSD sed needs an explicit (empty) backup suffix with -i
          sed -i '' "s/^_FALLBACK_VERSION = .*/_FALLBACK_VERSION = \"${VER}\"/" version.py

      - name: Determine version tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --dirty --always 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-dev.* ]] || [[ "$TAG" == *-rc.* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice ::Version tag resolved to: ${TAG}"

      - name: Generate SBOM (CycloneDX) of the build environment
        id: sbom
        shell: bash
        run: |
          BUILD_PY=$(python -c "import sys; print(sys.executable)")
          SBOM="Open-Motion-${{ steps.meta.outputs.TAG }}-macOS-sbom.cdx.json"
          pipx run --spec cyclonedx-bom cyclonedx-py environment "$BUILD_PY" \
            --of JSON --mc-type application -o "$SBOM"
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            python scripts/stamp_sbom.py "$SBOM" --name Open-Motion-macOS --version "${{ steps.meta.outputs.TAG }}"
          else
            python scripts/stamp_sbom.py "$SBOM" --name Open-Motion-macOS --version "${{ steps.meta.outputs.TAG }}" \
              --expect-sdk "$(tr -d '[:space:]' < sdk-version.txt)"
          fi
          echo "SBOM_PATH=${SBOM}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Motion-${{ steps.meta.outputs.TAG }}-macOS-sbom
          path: ${{ steps.sbom.outputs.SBOM_PATH }}

      - name: Build .app + DMG
        shell: bash
        env:
          # The version-stamp sed above dirties the checkout, so letting
          # build_macos.sh derive the version from `git describe --dirty`
          # would name the DMG "<tag>+dirty". Pass the clean tag instead.
          OPENMOTION_VERSION: ${{ steps.meta.outputs.TAG }}
        run: ./build_macos.sh   # CI env var is set by Actions → Finder styling and `open` are skipped

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          DMG_PATH=$(ls dist/Open-Motion-*-macOS.dmg | head -1)
          echo "DMG_PATH=${DMG_PATH}" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$(basename "$DMG_PATH" .dmg)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.DMG_NAME }}
          path: ${{ steps.dmg.outputs.DMG_PATH }}

      # Attach the DMG to the same release the Windows job creates. Both
      # jobs target the same tag; action-gh-release appends assets to an
      # existing release rather than clobbering it, so ordering is safe.
      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
          files: |
            ${{ steps.dmg.outputs.DMG_PATH }}
            ${{ steps.sbom.outputs.SBOM_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
