name: Build & Release

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Code-sign artifacts (requires the eSigner secrets)"
        type: boolean
        default: false
  push:
    branches: [main, next]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"             # production release (cut from main)       — SDK from PyPI
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"   # release candidate (cut from next)        — SDK from PyPI
      - "[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"  # dev pre-release   (cut from next)        — SDK from @next source
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── conda environment "omotion" ──────────────────────────────
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          activate-environment: omotion

      - name: Install dependencies into omotion
        shell: bash -el {0}
        run: |
          conda activate omotion
          python -m pip install --upgrade pip

          # SDK selection:
          #   * X.Y.Z-dev.N tag → source-install from openmotion-sdk@next so
          #     the dev pre-release ships against the matching dev SDK.
          #   * refs/heads/next push → same, source-install from
          #     openmotion-sdk@next. The bloodflow next branch tracks SDK
          #     API drift before any release, so it must always pair with
          #     SDK next; PyPI's latest stable can be API-behind.
          #   * X.Y.Z      tag → install latest openmotion-sdk from PyPI.
          #     Production releases ship against the fully-released SDK.
          #   * X.Y.Z-rc.N tag → install latest openmotion-sdk from PyPI.
          #     RCs are a hardening pass on a fully-released SDK, so PyPI too.
          #   * Anything else (refs/heads/main push, manual dispatch) →
          #     fetch the latest published openmotion-sdk wheel from
          #     GitHub Releases, with a source-install of main as the
          #     fallback.
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            echo "Dev/next-branch ($GITHUB_REF) — installing SDK from openmotion-sdk@next"
            pip install "git+https://github.com/OpenwaterHealth/openmotion-sdk.git@next"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Production/RC tag detected ($GITHUB_REF) — installing latest openmotion-sdk from PyPI"
            pip install --upgrade openmotion-sdk
          else
            # Fetch the latest openmotion-sdk wheel from GitHub Releases.
            # Kept as a one-liner so the YAML indent (12 spaces inside the
            # else block) doesn't get treated as Python module-level
            # whitespace — multiline `python -c` here would fail with
            # IndentationError: unexpected indent.
            WHL_URL=$(python -c "import json,urllib.request as ur,sys; d=json.load(ur.urlopen('https://api.github.com/repos/OpenwaterHealth/openmotion-sdk/releases/latest')); w=[a['browser_download_url'] for a in d.get('assets',[]) if a['name'].endswith('.whl')]; print(w[0] if w else '')" 2>/dev/null || true)

            if [ -n "$WHL_URL" ]; then
              echo "Installing pylib wheel: $WHL_URL"
              pip install "$WHL_URL"
            else
              echo "No wheel found – falling back to source install"
              pip install git+https://github.com/OpenwaterHealth/openmotion-sdk.git
            fi
          fi

          pip install -r requirements.txt

      # ── build ────────────────────────────────────────────────────
      - name: Stamp version from git tag
        shell: bash -el {0}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Strip leading 'v' only; '-dev.N' suffixes stay (semver pre-release).
            VER="${TAG#v}"
          else
            VER=$(git describe --tags --dirty --always --long 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "Stamping version: $VER"
          # Update _FALLBACK_VERSION in version.py so the frozen exe uses it
          sed -i "s/^_FALLBACK_VERSION = .*/_FALLBACK_VERSION = \"${VER}\"/" version.py

      - name: Build with PyInstaller
        shell: bash -el {0}
        run: |
          conda activate omotion
          python -m PyInstaller -y openwater.spec

      - name: Install WiX v5
        shell: pwsh
        run: |
          # Pin to 5.0.2 — the last MIT-licensed WiX. v6/v7 require accepting the
          # paid Open Source Maintenance Fee EULA (WIX7015) and would fail CI.
          dotnet tool install --global wix --version 5.0.2
          # In WiX v5 the standard bootstrapper application ships in this package
          # (not WixToolset.Bal.wixext); the bal: namespace in bundle.wxs is unchanged.
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ── eSigner CKA: load the EV code-signing cert ───────────────
      # PRODUCTION tag builds only (X.Y.Z with no pre-release suffix), plus
      # manual runs with sign=true, Authenticode-sign every Windows artifact
      # (~7 metered eSigner signings per build) with the org's SSL.com EV
      # cert. dev/rc pre-release tags build UNSIGNED to conserve the signing
      # quota. The private key never leaves SSL.com's cloud HSM; eSigner CKA
      # exposes it through Windows CNG so native signtool works against a
      # store thumbprint. When the ES_* secrets are absent this warns and
      # the build ships unsigned. See docs/SIGNING.md.
      - name: Set up eSigner CKA (EV code signing)
        if: (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')) || (github.event_name == 'workflow_dispatch' && inputs.sign)
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          # repo variable ES_MODE=sandbox targets SSL.com's sandbox
          # environment for pipeline testing (needs sandbox credentials)
          ES_MODE: ${{ vars.ES_MODE || 'product' }}
        run: |
          if (-not $env:ES_USERNAME -or -not $env:ES_PASSWORD -or -not $env:ES_TOTP_SECRET) {
            Write-Host "::warning::eSigner secrets (ES_USERNAME / ES_PASSWORD / ES_TOTP_SECRET) not set — artifacts will be UNSIGNED"
            exit 0
          }
          $work = Join-Path $env:RUNNER_TEMP "esigner-cka"
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work
          Invoke-WebRequest -OutFile eSigner_CKA_Setup.zip "https://github.com/SSLcom/eSignerCKA/releases/download/v1.0.8/SSL.COM-eSigner-CKA_1.0.8.zip"
          Expand-Archive -Force eSigner_CKA_Setup.zip
          Move-Item -Destination "eSigner_CKA_Installer.exe" -Path "eSigner_CKA_Setup\*.exe"
          $dir = Join-Path $env:USERPROFILE "eSignerCKA"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Start-Process ".\eSigner_CKA_Installer.exe" -ArgumentList "/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR=`"$dir`"" -Wait
          # Post-install helpers from SSL.com's reference workflow; guarded
          # because not every CKA build ships them (VC++ redists are already
          # on the hosted runners).
          foreach ($aux in @("$work\setup\vc_redist.x86.exe", "$work\setup\vc_redist.x64.exe")) {
            if (Test-Path $aux) { Start-Process $aux -ArgumentList "/install /q" -Wait }
          }
          foreach ($aux in @("$dir\RegisterKSP.exe", "$dir\eSignerCSP.Config.exe")) {
            if (Test-Path $aux) { & $aux | Out-Null }
          }
          & "$dir\eSignerCKATool.exe" config -mode $env:ES_MODE -user $env:ES_USERNAME -pass $env:ES_PASSWORD -totp $env:ES_TOTP_SECRET -key "$dir\master.key" -r
          & "$dir\eSignerCKATool.exe" unload
          & "$dir\eSignerCKATool.exe" load
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          if (-not $cert) { throw "eSigner CKA loaded no code-signing certificate" }
          Write-Host "Signing as: $($cert.Subject)  [$($cert.Thumbprint)]"
          "CODESIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # ── package ──────────────────────────────────────────────────
      - name: Determine version tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --dirty --always 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME=Open-Motion-${TAG}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_ZIP=Open-Motion-${TAG}.zip" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_NAME_RESEARCH=Open-Motion-Research-${TAG}" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT_ZIP_RESEARCH=Open-Motion-Research-${TAG}.zip" >> "$GITHUB_OUTPUT"

          # pre-release flag — X.Y.Z-dev.N (dev) and X.Y.Z-rc.N (release
          # candidate) tags both mark prerelease in the GitHub release UI.
          if [[ "$TAG" == *-dev.* ]] || [[ "$TAG" == *-rc.* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

          echo "::notice ::Version tag resolved to: ${TAG}"

      - name: Package all artifacts (zips + installers, clinical + Research)
        shell: pwsh
        env:
          # env.CODESIGN_THUMBPRINT is exported by the eSigner CKA step above;
          # the secret is a manual fallback for a runner with a local cert.
          CODESIGN_THUMBPRINT: ${{ env.CODESIGN_THUMBPRINT || secrets.CODESIGN_THUMBPRINT }}
        run: |
          powershell -NoProfile -File scripts\package_artifacts.ps1 -Version "${{ steps.meta.outputs.TAG }}"

      # ── always upload workflow artifact ──────────────────────────
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ARTIFACT_NAME }}
          path: ${{ steps.meta.outputs.ARTIFACT_ZIP }}

      - name: Upload Research workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.ARTIFACT_NAME_RESEARCH }}
          path: ${{ steps.meta.outputs.ARTIFACT_ZIP_RESEARCH }}

      # ── build release notes ───────────────────────────────────────
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        run: |
          : > notes.md

          if [[ "${{ steps.meta.outputs.PRERELEASE }}" == "true" ]]; then
            echo "⚠️ **PRE-RELEASE – NOT FOR PRODUCTION**" >> notes.md
            echo "" >> notes.md
          fi

          # Commits since previous tag (bullet list)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since ${PREV_TAG}" >> notes.md
            echo "" >> notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" >> notes.md
            echo "" >> notes.md
            echo "" >> notes.md
            echo "**Full diff:** [\`${PREV_TAG}...${{ steps.meta.outputs.TAG }}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.meta.outputs.TAG }})" >> notes.md
          else
            echo "### Commits" >> notes.md
            echo "" >> notes.md
            git log --pretty=format:"- %s (%h)" -20 >> notes.md
          fi

      # ── create release on tag push ──────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: ${{ steps.meta.outputs.TAG }}
          body_path: notes.md
          prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
          files: |
            ${{ steps.meta.outputs.ARTIFACT_ZIP }}
            ${{ steps.meta.outputs.ARTIFACT_ZIP_RESEARCH }}
            build/installer/Open-Motion-Setup-*.exe
            build/installer/Open-Motion-Research-Setup-*.exe
            resources/OpenMotionDriver-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-15   # Apple Silicon runner
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libusb
        run: brew install libusb

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          # SDK selection — mirrors the Windows job above (see the comment
          # there for the full rationale).
          if [[ "$GITHUB_REF" == refs/tags/*-dev.* ]] || [[ "$GITHUB_REF" == refs/heads/next ]]; then
            echo "Dev/next-branch ($GITHUB_REF) — installing SDK from openmotion-sdk@next"
            pip install "git+https://github.com/OpenwaterHealth/openmotion-sdk.git@next"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Production/RC tag detected ($GITHUB_REF) — installing latest openmotion-sdk from PyPI"
            pip install --upgrade openmotion-sdk
          else
            WHL_URL=$(python -c "import json,urllib.request as ur,sys; d=json.load(ur.urlopen('https://api.github.com/repos/OpenwaterHealth/openmotion-sdk/releases/latest')); w=[a['browser_download_url'] for a in d.get('assets',[]) if a['name'].endswith('.whl')]; print(w[0] if w else '')" 2>/dev/null || true)

            if [ -n "$WHL_URL" ]; then
              echo "Installing pylib wheel: $WHL_URL"
              pip install "$WHL_URL"
            else
              echo "No wheel found – falling back to source install"
              pip install git+https://github.com/OpenwaterHealth/openmotion-sdk.git
            fi
          fi

          pip install -r requirements.txt

          # requirements.txt pins PyInstaller 6.11.1 for the Windows build.
          # 6.11 has a macOS bug that creates Qt framework symlinks twice
          # (FileExistsError on Versions/Current/* during assemble); fixed
          # in later 6.x. Override the pin for this job only.
          pip install --upgrade "pyinstaller>=6.13"

      - name: Stamp version from git tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER=$(git describe --tags --dirty --always --long 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "Stamping version: $VER"
          # BSD sed needs an explicit (empty) backup suffix with -i
          sed -i '' "s/^_FALLBACK_VERSION = .*/_FALLBACK_VERSION = \"${VER}\"/" version.py

      - name: Determine version tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --dirty --always 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-dev.* ]] || [[ "$TAG" == *-rc.* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice ::Version tag resolved to: ${TAG}"

      - name: Build .app + DMG
        shell: bash
        env:
          # The version-stamp sed above dirties the checkout, so letting
          # build_macos.sh derive the version from `git describe --dirty`
          # would name the DMG "<tag>+dirty". Pass the clean tag instead.
          OPENMOTION_VERSION: ${{ steps.meta.outputs.TAG }}
        run: ./build_macos.sh   # CI env var is set by Actions → Finder styling and `open` are skipped

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          DMG_PATH=$(ls dist/Open-Motion-*-macOS.dmg | head -1)
          echo "DMG_PATH=${DMG_PATH}" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$(basename "$DMG_PATH" .dmg)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.DMG_NAME }}
          path: ${{ steps.dmg.outputs.DMG_PATH }}

      # Attach the DMG to the same release the Windows job creates. Both
      # jobs target the same tag; action-gh-release appends assets to an
      # existing release rather than clobbering it, so ordering is safe.
      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
          files: ${{ steps.dmg.outputs.DMG_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
